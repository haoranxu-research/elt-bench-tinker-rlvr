services:
  postgres:
    ports: !override ["127.0.0.1:5433:5432"]
  mongodb:
    ports: !override ["127.0.0.1:27017:27017"]
    healthcheck:
      test: >-
        echo "try { rs.status() } catch (err) { rs.initiate({_id:'rs0',members:[{_id:0,host:'elt-mongodb:27017'}]}) }"
        | mongosh --port 27017 --quiet
  localstack:
    ports: !override ["127.0.0.1:4566:4566"]
  python-rest-api:
    ports: !override ["127.0.0.1:5005:5005"]
